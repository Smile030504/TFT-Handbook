<section aria-label="Bộ lọc" class="filters unit-page-part">

  <div class="filter-top">
    <button class="btn primary" id="byCost">
      THEO GIÁ VÀNG
    </button>

    <button class="btn" id="byRole">
      THEO VAI TRÒ
    </button>

    <button class="btn" id="quiz">
      ẨN TÊN ĐỂ HỌC
    </button>

    <button class="btn ghost" id="reset">
      XÓA BỘ LỌC
    </button>

    <span class="space"></span>

    <input
      aria-label="Tìm tướng"
      class="search"
      id="search"
      placeholder="Tìm tên tướng..."
      type="search"
    />
  </div>

  <div class="row-filter" aria-label="Lọc theo vai trò">

    <span class="row-label">VAI TRÒ</span>

    <button type="button" class="pill-btn active" data-role="all">
      Tất cả
    </button>

    <button type="button" class="pill-btn" data-role="Tank">
      Đỡ đòn
    </button>

    <button type="button" class="pill-btn" data-role="Caster">
      Thuật sư
    </button>

    <button type="button" class="pill-btn" data-role="Fighter">
      Đấu sĩ
    </button>

    <button type="button" class="pill-btn" data-role="Marksman">
      Xạ thủ
    </button>

    <button type="button" class="pill-btn" data-role="Specialist">
      Đặc thù
    </button>

    <button type="button" class="pill-btn" data-role="Assassin">
      Sát thủ
    </button>

  </div>


</section>
